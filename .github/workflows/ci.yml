name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/rust-native-v2]
    paths:
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'rustfmt.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-package.yml'
  pull_request:
    branches: [main, experiment/rust-native-v2]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

# Match the Tauri CI behavior: newer commits replace stale checks for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (check + fmt + test)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR checkout is a merge commit; its first parent is the tested base.
          fetch-depth: 2

      - name: Determine Rust check scope
        id: scope
        shell: bash
        run: node scripts/ci/rust-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.scope.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: false

      - name: Install Linux system dependencies
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/install-linux-deps

      - name: cargo check
        if: steps.scope.outputs.rust == 'true'
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --check

      - name: cargo test
        if: steps.scope.outputs.rust == 'true'
        env:
          # Cargo runs each package's tests from its crate directory.
          OXIDETERM_AGENT_DIR: ${{ github.workspace }}/crates/oxideterm-gpui-app/resources/agents
        run: |
          # --no-fail-fast：一次把所有 crate 都跑完，避免第一个失败遮住后面的。
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 失败的测试名写成 annotation：job 日志需要 admin 权限才能下载，
            # 但 check run 的 annotations 是公开可读的，便于排查。
            grep -E '^    [A-Za-z_][A-Za-z0-9_]*::[A-Za-z0-9_:]+$' "$RUNNER_TEMP/cargo-test.log" \
              | sort -u | sed -n '1,40p' \
              | while IFS= read -r failed; do echo "::error::test failed:$failed"; done
          fi
          exit "$status"

  i18n:
    name: i18n completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Audit native locale catalogs
        run: python scripts/quality/audit_i18n.py

      - name: Test native packaging helpers
        run: python -m unittest scripts.tests.test_package_native scripts.tests.test_verify_native_package scripts.tests.test_compose_release_notes

  repository-policy:
    name: Repository automation policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test issue and maintenance policies
        run: >-
          node --test
          scripts/quality/tests/*.test.cjs
          scripts/automation/tests/*.test.cjs
